<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kanban WhatsApp Integration</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      margin: 0;
      padding: 0;
      background-color: #f7fafc;
      color: #2d3748;
    }
    .header {
      background-color: #075e54;
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    .header p {
      margin: 2px 0 0 0;
      font-size: 10px;
      opacity: 0.8;
    }
    .container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 10px;
      font-weight: 705;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #718096;
    }
    input, select {
      padding: 8px 12px;
      font-size: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      background: white;
      outline: none;
      color: #2d3748;
    }
    input:focus, select:focus {
      border-color: #075e54;
    }
    .btn-test {
      background-color: #e2e8f0;
      color: #4a5568;
      border: none;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .btn-test:hover {
      background-color: #cbd5e0;
    }
    .btn-save {
      background-color: #075e54;
      color: white;
      border: none;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
    }
    .btn-save:hover {
      background-color: #128c7e;
    }
    .status-badge {
      font-size: 10px;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      display: none;
      text-align: center;
    }
    .status-success {
      background-color: #e6fffa;
      color: #234e52;
      border: 1px solid #b2f5ea;
      display: block;
    }
    .status-error {
      background-color: #fff5f5;
      color: #742a2a;
      border: 1px solid #fed7d7;
      display: block;
    }
    .footer {
      border-top: 1px solid #edf2f7;
      padding: 12px;
      text-align: center;
      font-size: 9.5px;
      color: #a0aec0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="background-color: rgba(255,255,255,0.15); padding: 6px; border-radius: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="lux-icon" style="color: #48bb78; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </div>
    <div>
      <h1>Kanban CastTaskManager</h1>
      <p>Configuração da Extensão WhatsApp</p>
    </div>
  </div>

  <div class="container">
    <div class="form-group">
      <label for="apiUrl">Endereço do Painel Kanban</label>
      <input type="text" id="apiUrl" placeholder="https://seudominio.com" value="https://lightslategray-mantis-593401.hostingersite.com">
    </div>

    <div class="form-group">
      <label for="priority">Prioridade Padrão</label>
      <select id="priority">
        <option value="Baixa">Baixa</option>
        <option value="Média" selected>Média</option>
        <option value="Alta">Alta</option>
      </select>
    </div>

    <div class="form-group" style="margin-top: 4px;">
      <button id="btnTest" class="btn-test">Testar Sincronia / Conexão</button>
    </div>

    <div id="statusBadge" class="status-badge"></div>

    <button id="btnSave" class="btn-save">Salvar Configurações</button>
  </div>

  <div class="footer">
    Ativo em web.whatsapp.com &bull; Hostinger Site Pro &copy; 2026
  </div>

  <script src="popup.js"></script>
</body>
</html>
